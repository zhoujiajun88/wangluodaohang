<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾用 - 常用工具与项目入口</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background: var(--bg);
            font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .container {
            width: min(1080px, calc(100% - 48px));
            margin: 0 auto;
            padding: 42px 0 28px;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 34px;
        }

        .brand {
            max-width: 620px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 28px;
            font-weight: 750;
            line-height: 1;
        }

        .logo-mark {
            position: relative;
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            border-radius: var(--radius);
            background: var(--primary);
            box-shadow: inset 0 -9px 16px rgba(17, 24, 39, 0.16);
        }

        .logo-mark::before,
        .logo-mark::after {
            content: "";
            position: absolute;
            background: #ffffff;
        }

        .logo-mark::before {
            width: 15px;
            height: 15px;
            left: 8px;
            top: 7px;
            border-radius: 4px;
        }

        .logo-mark::after {
            width: 14px;
            height: 3px;
            right: 7px;
            bottom: 8px;
            border-radius: 999px;
        }

        .section-head {
            margin: 0 0 14px;
        }

        .section-title {
            margin: 0;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .card {
            min-height: 154px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            background: var(--surface);
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #c7d2fe;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
        }

        .tool-icon {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            color: #1d4ed8;
            background: var(--primary-soft);
            font-size: 15px;
            font-weight: 800;
        }

        .card strong {
            display: block;
            font-size: 18px;
            line-height: 1.35;
        }

        .card small {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 76px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .friends {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .friends a {
            margin: 0 5px;
            color: #4b5563;
            text-decoration: none;
        }

        .friends a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .sep {
            color: #d1d5db;
        }

        .copyright {
            color: #9ca3af;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 720px) {
            .container {
                width: min(100% - 28px, 1080px);
                padding-top: 28px;
            }

            .header {
                display: block;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <div class="logo"><span class="logo-mark" aria-hidden="true"></span><span>拾用</span></div>
            </div>
        </header>

        <main>
            <div class="section-head">
                <h1 class="section-title">常用工具</h1>
            </div>

            <div class="grid">
                <a href="tools/text2pic.html" class="card">
                    <span class="tool-icon">文</span>
                    <span>
                        <strong>文本转图片</strong>
                        <small>把一段文字快速导出成图片。</small>
                    </span>
                </a>

                <a href="tools/colorpicker.html" class="card">
                    <span class="tool-icon">色</span>
                    <span>
                        <strong>颜色选择器</strong>
                        <small>浏览常用色值，点击复制。</small>
                    </span>
                </a>

                <a href="tools/jsonparse.html" class="card">
                    <span class="tool-icon">{ }</span>
                    <span>
                        <strong>JSON 格式化</strong>
                        <small>格式化 JSON，并查看结构大纲。</small>
                    </span>
                </a>

                <a href="https://github.com/zhoujiajun88/keyboard_mouse" class="card" target="_blank"
                    rel="noopener noreferrer">
                    <span class="tool-icon">键</span>
                    <span>
                        <strong>键盘模拟鼠标</strong>
                        <small>通过键盘完成鼠标移动、点击等操作。</small>
                    </span>
                </a>
            </div>
        </main>

        <footer class="footer">
            <div class="friends">
                <a href="https://ixiaozhi.com" target="_blank" rel="noopener noreferrer">ixiaozhi</a> - deprecated
                <span class="sep">|</span>
                <a href="https://mail.zhoujiajun.com" target="_blank" rel="noopener noreferrer">mail</a>
            </div>
            <div class="copyright">© 2025 - 2026 ixiaozhi.</div>
        </footer>
    </div>
</body>

</html>
