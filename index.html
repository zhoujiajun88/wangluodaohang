<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H698BX2C0M"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-H698BX2C0M');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <title>拾用 - 常用工具与项目入口</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/home.css">
    <script src="assets/vendor/Sortable.min.js" defer></script>
    <script src="assets/home.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <a class="logo" href="./" aria-label="拾用首页">
                <img src="assets/favicon.svg" width="40" height="40" alt="">
                <span>拾用</span>
            </a>
        </header>
        <main>
            <div class="section-head">
                <h1>常用工具 <span class="tool-count" aria-label="7 个工具">07</span></h1>
                <div class="order-actions" hidden>
                    <button class="icon-button" id="resetOrder" type="button" aria-label="恢复默认排序" data-tooltip="恢复默认排序" hidden>
                        <svg aria-hidden="true"><use href="assets/icons.svg#rotate-ccw"></use></svg>
                    </button>
                    <button class="icon-button" id="sortToggle" type="button" aria-pressed="false" aria-label="调整排序" data-tooltip="调整排序">
                        <svg class="sort-icon" aria-hidden="true"><use href="assets/icons.svg#sliders-horizontal"></use></svg>
                        <svg class="done-icon" aria-hidden="true"><use href="assets/icons.svg#check"></use></svg>
                    </button>
                </div>
            </div>
            <ul class="grid" id="toolGrid" aria-label="工具列表">
                <li class="card" data-tool-id="text2pic" style="--accent:#2563eb;--tint:#edf3ff">
                    <a class="tool-link" href="tools/text2pic.html" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#image"></use></svg></span>
                        <span class="tool-text"><strong>Text2Pic</strong><small>文本转图片</small></span>
                    </a>
                </li>
                <li class="card" data-tool-id="colorpicker" style="--accent:#b7476c;--tint:#fcedf2">
                    <a class="tool-link" href="tools/colorpicker.html" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#palette"></use></svg></span>
                        <span class="tool-text"><strong>Color Picker</strong><small>颜色选择器</small></span>
                    </a>
                </li>
                <li class="card" data-tool-id="jsonparse" style="--accent:#208264;--tint:#eaf6ef">
                    <a class="tool-link" href="tools/jsonparse.html" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#braces"></use></svg></span>
                        <span class="tool-text"><strong>JSON Parse</strong><small>JSON 格式化</small></span>
                    </a>
                </li>
                <li class="card" data-tool-id="keyboard-mouse" style="--accent:#586176;--tint:#eef0f5">
                    <a class="tool-link" href="https://github.com/zhoujiajun88/keyboard_mouse" target="_blank" rel="noopener noreferrer" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#mouse-pointer-2"></use></svg></span>
                        <span class="tool-text"><strong>Keyboard Mouse</strong><small>键盘模拟鼠标</small></span>
                        <svg class="external-icon" aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
                        <span class="sr-only">（GitHub，在新标签页打开）</span>
                    </a>
                </li>
                <li class="card" data-tool-id="keyboard-swap" style="--accent:#936423;--tint:#faf3e7">
                    <a class="tool-link" href="https://github.com/zhoujiajun88/keyboard_swap" target="_blank" rel="noopener noreferrer" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#keyboard"></use></svg></span>
                        <span class="tool-text"><strong>Keyboard Swap</strong><small>交换键盘键位</small></span>
                        <svg class="external-icon" aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
                        <span class="sr-only">（GitHub，在新标签页打开）</span>
                    </a>
                </li>
                <li class="card" data-tool-id="emptychar" style="--accent:#217d89;--tint:#e9f5f6">
                    <a class="tool-link" href="tools/empty.html" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#text-cursor-input"></use></svg></span>
                        <span class="tool-text"><strong>EmptyChar</strong><small>插入空白字符</small></span>
                    </a>
                </li>
                <li class="card" data-tool-id="answer-book" style="--accent:#9b3f35;--tint:#f9eeea">
                    <a class="tool-link" href="tools/answer_book.html" draggable="false">
                        <span class="tool-icon"><svg aria-hidden="true"><use href="assets/icons.svg#book-open"></use></svg></span>
                        <span class="tool-text"><strong>The Book of Answers</strong><small>答案之书</small></span>
                    </a>
                </li>
            </ul>
            <p id="orderStatus" class="sr-only" role="status" aria-live="polite"></p>
        </main>
        <footer class="footer">
            <span class="copyright">© 2025 - 2026 拾用</span>
            <div class="friends">
                <a href="https://ixiaozhi.com" target="_blank" rel="noopener noreferrer">ixiaozhi</a>
                <span aria-hidden="true">/</span>
                <a href="https://mail.zhoujiajun.com" target="_blank" rel="noopener noreferrer">mail</a>
            </div>
        </footer>
    </div>
</body>
</html>
